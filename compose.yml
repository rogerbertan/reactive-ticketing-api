services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - reactive-ticketing-pgdata:/var/lib/postgresql/data

volumes:
  reactive-ticketing-pgdata:
    name: reactive-ticketing-pgdata
